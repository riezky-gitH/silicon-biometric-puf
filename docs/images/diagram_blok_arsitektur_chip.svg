<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640"><defs>
      <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <polygon points="0 0.5, 5 3, 0 5.5" fill="#334155"/>
      </marker>
      <marker id="arr_blue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <polygon points="0 0.5, 5 3, 0 5.5" fill="#1D4ED8"/>
      </marker>
      <marker id="arr_red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <polygon points="0 0.5, 5 3, 0 5.5" fill="#B91C1C"/>
      </marker>
      <marker id="arr_green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
        <polygon points="0 0.5, 5 3, 0 5.5" fill="#0F766E"/>
      </marker>
    </defs><rect width="1120" height="640" fill="#FFFFFF"/><rect x="20" y="20" width="1080" height="600" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5"/><rect x="20" y="20" width="1080" height="32" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/><text x="35" y="41" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#0F172A">DIAGRAM BLOK SISTEM: SILICON-BIOMETRIC SECURE ELEMENT (INTEL DE10-NANO / CYCLONE V SoC)</text><text x="1085" y="41" font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#475569" text-anchor="end">CLOCK: 50 MHz</text><rect x="40" y="70" width="240" height="480" fill="#F8FAFC" stroke="#3B82F6" stroke-width="1.2"/><rect x="40" y="70" width="240" height="26" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/><text x="160" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#1E40AF" text-anchor="middle">Hard Processor System (HPS)</text><text x="160" y="112" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#475569" text-anchor="middle">ARM Cortex-A9 | Linux OS</text><rect x="55" y="130" width="210" height="75" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="160" y="152" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Aplikasi Verifikator</text><text x="160" y="170" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#475569" text-anchor="middle">• Challenge Nonce Generator</text><text x="160" y="186" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#475569" text-anchor="middle">• Response Verification &amp; Log</text><rect x="55" y="225" width="210" height="75" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="160" y="247" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="bold" fill="#0F172A" text-anchor="middle">Program Enrollment</text><text x="160" y="265" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#475569" text-anchor="middle">• Karakterisasi Pasangan RO</text><text x="160" y="281" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#475569" text-anchor="middle">• Hitung Mask &amp; Helper Data</text><rect x="55" y="320" width="210" height="60" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="160" y="342" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="middle">Penyimpanan Data Publik</text><text x="160" y="360" font-family="Consolas, 'Courier New', monospace" font-size="8.5" fill="#475569" text-anchor="middle">Mask[255:0] &amp; Helper[51:0]</text><rect x="55" y="400" width="210" height="65" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="160" y="422" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="middle">Driver Memory-Mapped I/O</text><text x="160" y="440" font-family="Consolas, 'Courier New', monospace" font-size="8.5" fill="#475569" text-anchor="middle">/dev/mem mmap @ 0xFF20_0000</text><text x="160" y="505" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">Kunci fisik silikon TIDAK pernah</text><text x="160" y="519" font-family="Arial, Helvetica, sans-serif" font-size="8.5" fill="#64748B" text-anchor="middle">dapat dibaca oleh software HPS</text><rect x="310" y="210" width="90" height="200" fill="#F1F5F9" stroke="#475569" stroke-width="1.2"/><text x="355" y="240" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="middle">Lightweight</text><text x="355" y="255" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="middle">HPS-to-FPGA</text><text x="355" y="270" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="middle">Bridge</text><line x1="320" y1="285" x2="390" y2="285" stroke="#CBD5E1" stroke-width="1"/><text x="355" y="310" font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#475569" text-anchor="middle">AXI ke Avalon</text><text x="355" y="325" font-family="Consolas, 'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#1E293B" text-anchor="middle">32-bit Bus</text><text x="355" y="340" font-family="Consolas, 'Courier New', monospace" font-size="7.5" fill="#64748B" text-anchor="middle">0xFF20_0000</text><path d="M 265 295 L 310 295" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="287" y="288" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="bold" fill="#334155" text-anchor="middle">/32</text><path d="M 310 325 L 265 325" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="287" y="318" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="bold" fill="#334155" text-anchor="middle">/32</text><rect x="430" y="70" width="650" height="480" fill="#F8FAFC" stroke="#047857" stroke-width="1.2"/><rect x="430" y="70" width="650" height="26" fill="#ECFDF5" stroke="#047857" stroke-width="1"/><text x="445" y="87" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="bold" fill="#065F46">FPGA Fabric (Cyclone V)</text><text x="1065" y="87" font-family="Consolas, 'Courier New', monospace" font-size="9.5" fill="#047857" text-anchor="end">110K LE / 41,910 ALM</text><rect x="445" y="110" width="370" height="70" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="455" y="128" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A">Register Interface (Avalon-MM Slave)</text><rect x="740" y="115" width="68" height="15" fill="#FEE2E2" stroke="#EF4444" stroke-width="0.8"/><text x="774" y="126" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="bold" fill="#B91C1C" text-anchor="middle">LOCK BIT</text><text x="455" y="148" font-family="Consolas, 'Courier New', monospace" font-size="8" fill="#334155">CTRL (0x00) | STATUS (0x04) | NONCE[3:0] (0x10-1C)</text><text x="455" y="165" font-family="Consolas, 'Courier New', monospace" font-size="8" fill="#334155">RESP[3:0] (0x20-2C) | MASK (0x30) | HELPER (0x50)</text><path d="M 355 210 L 355 145 L 445 145" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="420" y="138" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="bold" fill="#334155" text-anchor="middle">/32</text><rect x="830" y="110" width="235" height="70" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/><text x="947" y="128" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F172A" text-anchor="middle">Control FSM</text><text x="947" y="148" font-family="Consolas, 'Courier New', monospace" font-size="8" fill="#334155" text-anchor="middle">IDLE → MEASURE → VOTE</text><text x="947" y="165" font-family="Consolas, 'Courier New', monospace" font-size="8" fill="#334155" text-anchor="middle">→ CORRECT → AES → DONE</text><path d="M 815 145 L 830 145" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr)"/><rect x="445" y="195" width="620" height="340" fill="#FFFBFB" stroke="#DC2626" stroke-width="1.4" stroke-dasharray="6 3"/><rect x="445" y="195" width="310" height="18" fill="#FEE2E2"/><text x="455" y="208" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="bold" fill="#B91C1C">BATAS KEAMANAN: KUNCI TIDAK KELUAR KE HPS</text><rect x="475" y="225" width="265" height="95" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/><text x="485" y="245" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F766E">Larik RO-PUF (Sumber Entropi)</text><text x="485" y="265" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• 512 Ring Oscillator (256 Pasangan)</text><text x="485" y="281" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• 7 Tingkat (1 NAND + 6 Inverter)</text><text x="485" y="297" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• Penempatan Simetris (Logic Lock)</text><text x="485" y="313" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• Frekuensi Kerja: 100 – 250 MHz</text><rect x="765" y="225" width="270" height="95" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/><text x="775" y="245" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F766E">Unit Ukur Frekuensi</text><text x="775" y="265" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• 16 Unit Ukur Paralel (16 Putaran)</text><text x="775" y="281" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• Dual Counter 18-bit + MUX 16:1</text><text x="775" y="297" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• Jendela Ukur 2^13 Clock (164 µs)</text><text x="775" y="313" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• RO Dihentikan Sebelum Counter Dibaca</text><path d="M 740 272 L 765 272" fill="none" stroke="#0F766E" stroke-width="1.8" marker-end="url(#arr_green)"/><text x="752" y="265" font-family="Consolas, 'Courier New', monospace" font-size="7.5" fill="#0F766E" text-anchor="middle">f_RO</text><path d="M 900 180 L 900 225" fill="none" stroke="#64748B" stroke-width="1.2" marker-end="url(#arr)"/><text x="910" y="205" font-family="Consolas, 'Courier New', monospace" font-size="7.5" fill="#64748B">ctrl</text><path d="M 900 320 L 900 345 L 755 345 L 755 365" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arr_green)"/><text x="830" y="340" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="bold" fill="#0F766E" text-anchor="middle">raw_response [256-bit]</text><rect x="475" y="365" width="560" height="70" fill="#FFFFFF" stroke="#0F766E" stroke-width="1"/><text x="485" y="383" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#0F766E">Error-Correction Logic Tiga Lapis</text><rect x="485" y="392" width="170" height="35" fill="#F0FDFA" stroke="#99F6E4" stroke-width="0.8"/><text x="570" y="406" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="bold" fill="#115E59" text-anchor="middle">1. Reliability Masking</text><text x="570" y="420" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#134E4A" text-anchor="middle">Pilih 195 pasangan stabil</text><rect x="670" y="392" width="170" height="35" fill="#F0FDFA" stroke="#99F6E4" stroke-width="0.8"/><text x="755" y="406" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="bold" fill="#115E59" text-anchor="middle">2. Majority Voting</text><text x="755" y="420" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#134E4A" text-anchor="middle">5x pengukuran per bit</text><rect x="855" y="392" width="170" height="35" fill="#F0FDFA" stroke="#99F6E4" stroke-width="0.8"/><text x="940" y="406" font-family="Arial, Helvetica, sans-serif" font-size="8.5" font-weight="bold" fill="#115E59" text-anchor="middle">3. Hamming(15,11)</text><text x="940" y="420" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#134E4A" text-anchor="middle">Helper data 52-bit</text><path d="M 655 410 L 670 410" fill="none" stroke="#0F766E" stroke-width="1.2" marker-end="url(#arr_green)"/><path d="M 840 410 L 855 410" fill="none" stroke="#0F766E" stroke-width="1.2" marker-end="url(#arr_green)"/><path d="M 755 435 L 755 460" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#arr_red)"/><rect x="680" y="440" width="150" height="15" fill="#FEE2E2" stroke="#DC2626" stroke-width="0.8"/><text x="755" y="451" font-family="Consolas, 'Courier New', monospace" font-size="8" font-weight="bold" fill="#B91C1C" text-anchor="middle">KUNCI PUF [128-bit] (INTERNAL)</text><rect x="475" y="460" width="560" height="65" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.2"/><text x="485" y="480" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#1D4ED8">Mesin Autentikasi AES-128 (secworks/aes, BSD-2)</text><text x="485" y="498" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• Kunci masuk langsung dari logika PUF (Zero-Key Storage, tidak lewat register)</text><text x="485" y="514" font-family="Arial, Helvetica, sans-serif" font-size="8.8" fill="#334155">• Enkripsi: AES-128(Kunci_PUF, Nonce) | Waktu proses &lt; 1 µs | Total latensi &lt; 50 ms</text><path d="M 500 180 L 500 190 L 460 190 L 460 490 L 475 490" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr_blue)"/><rect x="446" y="335" width="28" height="50" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/><text x="460" y="360" font-family="Consolas, 'Courier New', monospace" font-size="7" font-weight="bold" fill="#1E40AF" transform="rotate(-90 460 360)" text-anchor="middle">nonce [128b]</text><path d="M 1035 490 L 1050 490 L 1050 190 L 780 190 L 780 180" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr_blue)"/><rect x="1036" y="335" width="28" height="50" fill="#EFF6FF" stroke="#93C5FD" stroke-width="0.8"/><text x="1050" y="360" font-family="Consolas, 'Courier New', monospace" font-size="7" font-weight="bold" fill="#1E40AF" transform="rotate(90 1050 360)" text-anchor="middle">respons [128b]</text><rect x="40" y="565" width="1040" height="40" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/><text x="55" y="589" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="bold" fill="#334155">I/O Papan DE10-Nano:</text><circle cx="210" cy="585" r="4.5" fill="#16A34A"/><text x="222" y="585" font-family="Consolas, 'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#16A34A">LED Hijau (LED0):</text><text x="222" y="596" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#64748B">Chip Asli / Autentikasi Sukses</text><circle cx="425" cy="585" r="4.5" fill="#DC2626"/><text x="437" y="585" font-family="Consolas, 'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#DC2626">LED Merah (LED1):</text><text x="437" y="596" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#64748B">Chip Tiruan / Ditolak</text><rect x="636" y="581" width="9" height="9" fill="#475569"/><text x="652" y="585" font-family="Consolas, 'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#475569">KEY0 / KEY1:</text><text x="652" y="596" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#64748B">Reset Sistem &amp; Trigger Manual</text><rect x="851" y="581" width="9" height="9" fill="#475569"/><text x="867" y="585" font-family="Consolas, 'Courier New', monospace" font-size="8.5" font-weight="bold" fill="#475569">SW0:</text><text x="867" y="596" font-family="Arial, Helvetica, sans-serif" font-size="7.5" fill="#64748B">Mode: 0 = Operasional | 1 = Enrollment</text></svg>